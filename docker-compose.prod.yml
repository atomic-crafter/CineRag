# Production stack for a single server (e.g. one EC2 instance):
#   docker compose -f docker-compose.prod.yml up -d --build
# Only the web container is published (port 80); db and app stay on the internal network.
# Create ./.env with WEB_PASSWORD=... (site password, username "epf") and copy rag/.env.example to rag/.env first (LLM_PROVIDER=bedrock uses the instance's IAM role).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ragdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./rag/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: ./rag
    env_file:
      - ./rag/.env
    environment:
      DATABASE_URL: postgresql://rag:${POSTGRES_PASSWORD:-ragpass}@db:5432/ragdb
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - hfcache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./Front/FrontCineRag
      args:
        WEB_PASSWORD: ${WEB_PASSWORD:?set WEB_PASSWORD in .env}
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  hfcache:
